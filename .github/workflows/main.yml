name: Build APK IA Profissional

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Descompactar ZIP do Projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d temp_project
            if [ -f "temp_project/settings.gradle.kts" ] || [ -f "temp_project/settings.gradle" ]; then
              cp -rf temp_project/* .
            else
              SUBDIR=$(find temp_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_project
          fi

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IA-Profissional-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
